[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtpl-glm-pricing"
version = "0.1.0"
description = "Production-grade motor third-party liability (MTPL) GLM pricing pipeline on Belgian beMTPL97 portfolio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Redhwane" }]
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyreadr>=0.5",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-requests>=2.31",
]

[project.scripts]
mtpl-pricing = "mtpl_pricing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "T20",  # flake8-print (enforces zero print() in src/)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "N803",  # Allow standard mathematical uppercase names like X, B
    "N806",  # Allow X_train, X_test, B_ref in statistical functions
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: end-to-end pipeline and CLI tests",
]

[tool.coverage.run]
source = ["mtpl_pricing"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
packages = ["mtpl_pricing"]
mypy_path = "src"
strict = true
warn_unused_configs = true
disallow_any_generics = true
ignore_missing_imports = true
